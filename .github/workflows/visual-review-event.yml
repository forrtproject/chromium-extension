name: Visual review decision

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  relay:
    if: >-
      github.event.action == 'dismissed' ||
      github.event.review.state == 'approved' ||
      github.event.review.state == 'changes_requested'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        env:
          EVENT_FILE: ${{ runner.temp }}/event.json
        with:
          script: |
            const fs = require('node:fs');
            const pr = context.payload.pull_request;
            fs.writeFileSync(process.env.EVENT_FILE, JSON.stringify({pr: pr.number, head: pr.head.sha}));
      - uses: actions/upload-artifact@v4
        with:
          name: visual-review-event
          path: ${{ runner.temp }}/event.json
          retention-days: 1
