name: Release


on:
  push:
    branches: # on push to a channel branch
      - main
      - testing
    paths-ignore:
      # Skip the bot's data commits and docs-only changes, but not
      # manifest.json/package.json: a version bump must rebuild the zip.
      - "src/retractions.json"
      - "src/registered-reports.json"
      - "docs/**"
    tags: # or a version tag push (any branch)
      - 'v*'
      - 'testing-v*'


permissions:
  contents: write # softprops/action-gh-release creates releases and uploads assets


jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Keep the write-capable token out of .git/config, where dependency
          # install scripts could read it. The release action takes its token
          # from the action input instead.
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve the release channel
        id: channel
        run: |
          case "$GITHUB_REF" in
            refs/tags/testing-v*|refs/heads/testing)
              {
                echo "name=testing"
                echo "branch=testing"
                echo "build_script=build"
                echo "zip=flora-extension-testing.zip"
                echo "firefox_zip=flora-extension-firefox-testing.zip"
                echo "draft_tag=draft-testing"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              {
                echo "name=stable"
                echo "branch=main"
                echo "build_script=build:release"
                echo "zip=flora-extension.zip"
                echo "firefox_zip=flora-extension-firefox.zip"
                echo "draft_tag=draft"
              } >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Require the tag to match its channel branch and the manifest version
        if: github.ref_type == 'tag'
        env:
          CHANNEL_BRANCH: ${{ steps.channel.outputs.branch }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$CHANNEL_BRANCH"
          tag_version="${GITHUB_REF_NAME#testing-}"
          tag_version="${tag_version#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run ${{ steps.channel.outputs.build_script }}
      - name: Create zips
        env:
          ZIP_NAME: ${{ steps.channel.outputs.zip }}
          FIREFOX_ZIP_NAME: ${{ steps.channel.outputs.firefox_zip }}
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          mkdir -p flora-extension
          cp manifest.json flora-extension/
          cp -r dist flora-extension/
          if [ "$CHANNEL" = "testing" ]; then
            npx tsx scripts/stamp-testing-manifest.ts flora-extension/manifest.json
          fi
          zip -r "$ZIP_NAME" flora-extension
          cp -r flora-extension flora-extension-firefox
          firefox_channel=""
          if [ "$CHANNEL" = "testing" ]; then firefox_channel="--testing"; fi
          npx tsx scripts/firefox-manifest.ts flora-extension-firefox/manifest.json $firefox_channel
          (cd flora-extension-firefox && zip -r "../$FIREFOX_ZIP_NAME" .)
      - name: Sign the Firefox add-on for self-distribution
        if: github.ref_type == 'tag' && steps.channel.outputs.name == 'stable'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::warning::AMO_JWT_ISSUER/AMO_JWT_SECRET are not set: attach a signed flora-extension-firefox.xpi and updates.json to this release by hand, or Firefox users get no update."
            exit 0
          fi
          git archive --format=zip -o firefox-source.zip HEAD
          npx --yes web-ext@8 sign --source-dir flora-extension-firefox --channel unlisted \
            --upload-source-code firefox-source.zip --artifacts-dir web-ext-artifacts \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          mv web-ext-artifacts/*.xpi flora-extension-firefox.xpi
          npx tsx scripts/firefox-update-manifest.ts flora-extension-firefox.xpi updates.json

      # see customization options at:
      # https://github.com/marketplace/actions/gh-release#-customizing
      - name: Draft release
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.channel.outputs.draft_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.channel.outputs.zip }}
            ${{ steps.channel.outputs.firefox_zip }}
          draft: true
          prerelease: ${{ steps.channel.outputs.name == 'testing' }}
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ steps.channel.outputs.zip }}
            ${{ steps.channel.outputs.firefox_zip }}
            flora-extension-firefox.xpi
            updates.json
          generate_release_notes: true
          prerelease: ${{ steps.channel.outputs.name == 'testing' }}
          make_latest: ${{ steps.channel.outputs.name == 'stable' }}
