# Refreshes src/retractions.json from the Retraction Watch database.
#
# Data source: The Retraction Watch Database, made available by The Center
# for Scientific Integrity / Retraction Watch in partnership with Crossref
# under CC-BY 4.0, mirrored at:
#   https://gitlab.com/crossref/retraction-watch-data
#
# Please credit Retraction Watch when using this data downstream.

name: Update Retractions

on:
  schedule:
    # Upstream's `build-retractionwatch-csv` job commits ~23:00 UTC daily;
    # we run shortly after so the cached file tracks the latest build.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read # the push to main uses the data bot's token
  statuses: write # mark the data-only commit as needing no visual review

# Both data updaters push to main, so all their runs queue instead of racing.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # The job self-approves its commit, so it must only ever extend main. A
    # manual run on another branch would push that branch's commits along with it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Holds the data bot's key, which this environment releases only to main.
    environment: data-updates
    steps:
      - uses: actions/checkout@v6
        with:
          # Keep the write token out of .git/config while the updater script
          # runs; only the commit step below gets it.
          persist-credentials: false

      - name: Skip if upstream has no recent commit
        id: check
        env:
          # Upstream rebuilds daily, so 26h leaves a small slack window before
          # we treat a silent day as "nothing new to fetch".
          MAX_AGE_HOURS: "26"
        run: |
          set -euo pipefail
          curl -sSfL "https://gitlab.com/api/v4/projects/crossref%2Fretraction-watch-data/repository/commits?path=retraction_watch.csv&per_page=1" -o /tmp/last_commit.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          from datetime import datetime, timezone
          with open("/tmp/last_commit.json") as f:
              commits = json.load(f)
          if not commits:
              print("No upstream commits returned by GitLab API.", file=sys.stderr)
              print("skip=true")
              sys.exit(0)
          ts = commits[0]["committed_date"]
          last = datetime.fromisoformat(ts)
          age_hours = (datetime.now(timezone.utc) - last).total_seconds() / 3600
          print(f"Last upstream commit: {ts} ({age_hours:.1f}h ago)", file=sys.stderr)
          max_age = float(os.environ["MAX_AGE_HOURS"])
          print("skip=true" if age_hours > max_age else "skip=false")
          PY

      - uses: actions/setup-node@v6
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 24

      - run: node retractions-updater.ts
        if: steps.check.outputs.skip == 'false'

      # Created only after the updater script has run, so it never sees this token.
      - name: Create data bot token
        id: data-bot
        if: steps.check.outputs.skip == 'false'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DATA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DATA_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit changes
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ steps.data-bot.outputs.token }}
        run: |
          .github/scripts/push-data-commit.sh src/retractions.json "Data: refresh Retraction Watch retractions cache

          Source: Retraction Watch Database (CC-BY 4.0), via Crossref mirror at
          https://gitlab.com/crossref/retraction-watch-data. Credit: Retraction
          Watch / The Center for Scientific Integrity."
