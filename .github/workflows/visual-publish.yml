name: Attach visual evidence
on:
  workflow_run:
    workflows: [Visual evidence, Visual review decision]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to refresh
        required: true
        type: number
jobs:
  select:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.name == 'Visual evidence' ||
        (github.event.workflow_run.name == 'Visual review decision' &&
         github.event.workflow_run.conclusion == 'success')))
    runs-on: ubuntu-24.04
    outputs:
      run-id: ${{ steps.capture.outputs.run-id }}
      pr: ${{ steps.capture.outputs.pr }}
    steps:
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Visual review decision'
        with:
          name: visual-review-event
          path: ${{ runner.temp }}/review-event
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/github-script@v7
        id: capture
        env:
          REVIEW_EVENT_FILE: ${{ runner.temp }}/review-event/event.json
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            const run = context.payload.workflow_run;
            const reviewEvent = fs.existsSync(process.env.REVIEW_EVENT_FILE)
              ? JSON.parse(fs.readFileSync(process.env.REVIEW_EVENT_FILE, 'utf8')) : null;
            const number = Number(context.payload.inputs?.pr ?? reviewEvent?.pr ?? run?.pull_requests?.[0]?.number);
            let pr;
            if (number) {
              ({data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number}));
            } else if (run?.name === 'Visual evidence') {
              const prs = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open'});
              pr = prs.find(p => p.head.sha === run.head_sha && p.head.repo?.full_name === run.head_repository.full_name);
            }
            if (!pr || pr.state !== 'open') return;
            if (reviewEvent && (reviewEvent.pr !== pr.number || reviewEvent.head !== pr.head.sha)) return;
            const runs = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'visual.yml', event: 'pull_request', head_sha: pr.head.sha, per_page: 100});
            const capture = runs.data.workflow_runs.find(r =>
              r.head_repository.full_name === pr.head.repo.full_name &&
              r.pull_requests?.some(p => p.number === pr.number));
            if (!capture || capture.status !== 'completed') return;
            core.setOutput('run-id', String(capture.id));
            core.setOutput('pr', String(pr.number));
  describe:
    needs: select
    permissions:
      # The trusted publisher writes generated PNGs to the visual-evidence branch.
      contents: write
      actions: read
      pull-requests: write
      issues: write
      statuses: write
    if: needs.select.outputs.run-id
    concurrency:
      # The evidence branch is shared by PRs; serialize its commits.
      group: visual-publish-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      # The trusted workflow executes default-branch code, never the PR's scripts.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: visual-report
          # Keep the untrusted artifact outside the trusted checkout.
          path: ${{ runner.temp }}/visual-report
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.run-id }}
      - uses: actions/github-script@v7
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Visual evidence'
        env:
          VISUAL_RUN_ID: ${{ needs.select.outputs.run-id }}
          VISUAL_PR: ${{ needs.select.outputs.pr }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const pull_number = Number(process.env.VISUAL_PR);
            const run_id = Number(process.env.VISUAL_RUN_ID);
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number});
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
            if (pr.state === 'open' && pr.head.sha === run.head_sha)
              await github.rest.repos.createCommitStatus({owner, repo, sha: pr.head.sha,
                context: 'Visual approval', state: 'pending', target_url: pr.html_url,
                description: 'Publishing screenshots in the PR conversation'});
      - uses: actions/github-script@v7
        env:
          VISUAL_RUN_ID: ${{ needs.select.outputs.run-id }}
          VISUAL_PR: ${{ needs.select.outputs.pr }}
          VISUAL_REPORT_DIR: ${{ runner.temp }}/visual-report
        with:
          script: |
            const publish = require('./.github/scripts/visual-publish.cjs');
            await publish({github, context});
