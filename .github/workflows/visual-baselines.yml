name: Visual baselines

# Renders every fixture on Ubuntu and commits the PNGs to
# tests/visual/baselines/. With a PR number, the commit goes on that PR's
# branch. Without one, it goes on a new branch from main with its own PR.
# The normal visual review then asks for a `visuals ok` comment.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request to update (leave empty to open a new PR from main)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: visual-baselines-${{ inputs.pr || 'main' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      branch: ${{ steps.target.outputs.branch }}
    steps:
      - uses: actions/github-script@v7
        id: target
        env:
          PR: ${{ inputs.pr }}
        with:
          script: |
            const {owner, repo} = context.repo;
            if (process.env.PR) {
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: Number(process.env.PR)});
              if (pr.state !== 'open') throw new Error(`PR #${pr.number} is not open`);
              if (pr.head.repo.full_name !== `${owner}/${repo}`)
                throw new Error('The PR branch must be in this repository');
              core.setOutput('sha', pr.head.sha);
              core.setOutput('branch', pr.head.ref);
            } else {
              const {data: main} = await github.rest.repos.getBranch({owner, repo,
                branch: context.payload.repository.default_branch});
              core.setOutput('sha', main.commit.sha);
              core.setOutput('branch', '');
            }

  capture:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci && npm run build
      # All fixtures must render; a failure leaves the baselines unchanged.
      - run: npm run test:visual:update
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/baselines/
          if-no-files-found: error
          retention-days: 7

  commit:
    needs: [resolve, capture]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: visual-baselines
          path: ${{ runner.temp }}/baselines
      - uses: actions/github-script@v7
        env:
          DIR: ${{ runner.temp }}/baselines
          PR: ${{ inputs.pr }}
          SHA: ${{ needs.resolve.outputs.sha }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const {owner, repo} = context.repo;
            const {DIR, PR, SHA} = process.env;
            let branch = process.env.BRANCH;
            const files = fs.readdirSync(DIR).filter(f => /^[a-z0-9-]+\.png$/.test(f));
            const tree = [];
            for (const file of files) {
              const {data: blob} = await github.rest.git.createBlob({owner, repo,
                content: fs.readFileSync(path.join(DIR, file)).toString('base64'), encoding: 'base64'});
              tree.push({path: `tests/visual/baselines/${file}`, mode: '100644', type: 'blob', sha: blob.sha});
            }
            const {data: parent} = await github.rest.git.getCommit({owner, repo, commit_sha: SHA});
            const {data: newTree} = await github.rest.git.createTree({owner, repo, base_tree: parent.tree.sha, tree});
            if (newTree.sha === parent.tree.sha) {
              core.notice('Committed baselines already match the Ubuntu renders.');
              return;
            }
            const {data: commit} = await github.rest.git.createCommit({owner, repo, tree: newTree.sha, parents: [SHA],
              message: `Render visual baselines on Ubuntu\n\nWorkflow run: ${context.runId}`});
            let number = Number(PR);
            if (branch) {
              // Refuses if the PR branch moved since the capture started.
              await github.rest.git.updateRef({owner, repo, ref: `heads/${branch}`, sha: commit.sha, force: false});
            } else {
              branch = `visual-baselines-${context.runId}`;
              await github.rest.git.createRef({owner, repo, ref: `refs/heads/${branch}`, sha: commit.sha});
              const {data: pr} = await github.rest.pulls.create({owner, repo, head: branch,
                base: context.payload.repository.default_branch,
                title: 'Render visual baselines on Ubuntu',
                body: 'Replaces `tests/visual/baselines/` with Ubuntu renders from the `Visual baselines` workflow. ' +
                  'Check the before/after images in the visual review comment, then comment `visuals ok`.'});
              number = pr.number;
            }
            // A push with this workflow's token does not start the PR workflows.
            await github.rest.actions.createWorkflowDispatch({owner, repo,
              workflow_id: 'visual.yml', ref: branch, inputs: {pr: String(number)}});
            core.notice(`Committed ${files.length} baselines to ${branch} (PR #${number}).`);
