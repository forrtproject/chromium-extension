<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-header">
      <img src="forrt-logo.svg" alt="FORRT" class="popup-logo" />
      <div class="popup-title">
        <strong>FORRT ORE</strong>
        <span data-i18n="popup.subtitle">Open Research Extension</span>
      </div>
      <span class="popup-version" id="popup-version" aria-label="Extension version" data-i18n-attr="aria-label:popup.versionLabel"></span>
    </div>

    <div id="testing-banner" class="testing-banner" role="note" data-i18n="popup.testingBanner" hidden>
      <strong>Testing version.</strong> Things may change or break.
    </div>

    <div class="popup-body">
      <div class="popup-domain" id="current-domain"></div>

      <div id="snooze-note" class="popup-snooze-note" hidden></div>

      <section id="page-findings" class="popup-findings" aria-label="Findings on this page" data-i18n-attr="aria-label:popup.findings.label" hidden>
        <div id="page-findings-list" aria-live="polite"></div>
        <button id="open-report-btn" class="popup-open-report" type="button" data-i18n="popup.openReport" hidden>Open report</button>
      </section>

      <button id="resume-btn" class="popup-btn popup-btn--resume" type="button" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M10 8l6 4-6 4z" />
        </svg>
        <span data-i18n="popup.resume">Resume now</span>
      </button>

      <button id="snooze-btn" class="popup-btn popup-btn--snooze" type="button" aria-expanded="false" aria-controls="snooze-options">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>
        <span data-i18n="popup.snooze.button">Snooze on this site</span>
      </button>

      <div id="snooze-options" class="popup-snooze-options" role="group" aria-label="Snooze for how long" data-i18n-attr="aria-label:popup.snooze.choicesLabel" hidden></div>

      <button id="block-btn" class="popup-btn popup-btn--block" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M4.93 4.93l14.14 14.14" />
        </svg>
        <span class="popup-btn-text">
          <span id="block-btn-label" data-i18n="popup.block.turnOff">Turn off on this site</span>
          <span class="popup-btn-sub" id="block-btn-sub" data-i18n="popup.block.sub">Until you turn it back on</span>
        </span>
      </button>

      <button id="hide-btn" class="popup-btn popup-btn--hide" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
          <line x1="1" y1="1" x2="23" y2="23" />
        </svg>
        <span class="popup-btn-text">
          <span id="hide-btn-label" data-i18n="popup.hide.hide">Hide on this page</span>
          <span class="popup-btn-sub" id="hide-btn-sub" data-i18n="popup.hide.sub">Until you reload it</span>
        </span>
      </button>

      <div class="popup-divider"></div>

      <button id="report-btn" class="popup-btn popup-btn--report" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
        <span id="report-btn-label" data-i18n="popup.reportIssue">Report an issue</span>
      </button>

      <div id="screenshot-row" hidden>
        <label class="popup-toggle popup-toggle--sub" for="screenshot-toggle">
          <span class="popup-toggle-label" data-i18n="popup.screenshot">Include a screenshot</span>
          <span class="toggle-switch">
            <input type="checkbox" id="screenshot-toggle" />
            <span class="toggle-track"></span>
          </span>
        </label>
      </div>

      <div class="popup-divider"></div>

      <details class="popup-troubleshoot" id="troubleshoot">
        <summary class="popup-troubleshoot-summary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 2h8" />
            <path d="M9 6V4h6v2" />
            <rect x="7" y="6" width="10" height="14" rx="5" />
            <path d="M3 11h4M17 11h4M3 16h4M17 16h4" />
          </svg>
          <span class="popup-toggle-label" data-i18n="popup.troubleshooting">Troubleshooting</span>
          <span id="debug-state-chip" class="popup-debug-chip" data-i18n="popup.debug.chip" hidden>Debug on</span>
        </summary>
        <label class="popup-toggle" for="debug-toggle">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 2h8" />
            <path d="M9 6V4h6v2" />
            <rect x="7" y="6" width="10" height="14" rx="5" />
            <path d="M3 11h4M17 11h4M3 16h4M17 16h4" />
          </svg>
          <span class="popup-toggle-label" data-i18n="popup.debug.toggle">Debug mode</span>
          <span class="toggle-switch">
            <input type="checkbox" id="debug-toggle" />
            <span class="toggle-track"></span>
          </span>
        </label>

        <p id="debug-hint" class="popup-hint" data-i18n="popup.debug.hintOff">
          Shows ORE's progress on each page and adds a detailed log to issue reports.
        </p>

        <label class="popup-toggle popup-toggle--sub" for="log-copy-toggle" id="log-copy-row" hidden>
          <span class="popup-toggle-label" data-i18n="popup.debug.offerCopyLog">Offer "Copy log" after each pass</span>
          <span class="toggle-switch">
            <input type="checkbox" id="log-copy-toggle" />
            <span class="toggle-track"></span>
          </span>
        </label>
      </details>

      <div class="popup-divider"></div>

      <nav class="popup-footer" aria-label="More" data-i18n-attr="aria-label:popup.footerLabel">
        <button id="page-tour-btn" class="popup-link" type="button" data-i18n="popup.tourPage">Tour this page</button>
        <span class="popup-footer-sep" aria-hidden="true"></span>
        <button id="tour-btn" class="popup-link" type="button" data-i18n="popup.howItWorks">How it works</button>
        <span class="popup-footer-sep" aria-hidden="true"></span>
        <button id="options-btn" class="popup-link" type="button" data-i18n="popup.settings">Settings</button>
      </nav>
      <div id="tour-help" class="popup-tour-help" role="dialog" aria-modal="false" aria-labelledby="tour-help-title" aria-describedby="tour-help-text" hidden>
        <strong id="tour-help-title"></strong>
        <p id="tour-help-text"></p>
        <div class="popup-tour-help-actions">
          <button id="tour-sample-btn" class="popup-tour-help-primary" type="button" data-i18n="popup.tourHelp.openSample">Open a sample article</button>
          <button id="tour-reload-btn" class="popup-link" type="button" data-i18n="popup.tourHelp.reload" hidden>Reload this page</button>
          <button id="tour-dismiss-btn" class="popup-link" type="button" data-i18n="popup.tourHelp.notNow">Not now</button>
        </div>
      </div>
    </div>

    <div id="popup-status" class="popup-status" hidden></div>

    <script src="popup.js"></script>
  </body>
</html>
