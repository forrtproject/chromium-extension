<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-header">
      <img src="forrt-logo.svg" alt="FORRT" class="popup-logo" />
      <div class="popup-title">
        <strong>FORRT ORE</strong>
        <span>Open Research Extension</span>
      </div>
      <span class="popup-version" id="popup-version" aria-label="Extension version"></span>
    </div>

    <div class="popup-body">
      <div class="popup-domain" id="current-domain"></div>

      <div id="snooze-note" class="popup-snooze-note" hidden></div>

      <button id="resume-btn" class="popup-btn popup-btn--resume" type="button" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M10 8l6 4-6 4z" />
        </svg>
        <span>Resume now</span>
      </button>

      <button id="snooze-btn" class="popup-btn popup-btn--snooze" type="button" aria-expanded="false" aria-controls="snooze-options">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>
        <span>Snooze on this domain</span>
      </button>

      <div id="snooze-options" class="popup-snooze-options" role="group" aria-label="Snooze for how long" hidden></div>

      <button id="block-btn" class="popup-btn popup-btn--block" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M4.93 4.93l14.14 14.14" />
        </svg>
        <span id="block-btn-label">Disable on this domain</span>
      </button>

      <button id="hide-btn" class="popup-btn popup-btn--hide" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
          <line x1="1" y1="1" x2="23" y2="23" />
        </svg>
        <span id="hide-btn-label">Hide on this page</span>
      </button>

      <div class="popup-divider"></div>

      <button id="report-btn" class="popup-btn popup-btn--report" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
        <span id="report-btn-label">Report an issue on this domain</span>
      </button>

      <div id="screenshot-row" hidden>
        <label class="popup-toggle popup-toggle--sub" for="screenshot-toggle">
          <span class="popup-toggle-label">Include a screenshot</span>
          <span class="toggle-switch">
            <input type="checkbox" id="screenshot-toggle" />
            <span class="toggle-track"></span>
          </span>
        </label>
        <p class="popup-hint popup-hint--sub">
          It shows us exactly what you saw, so the problem is much easier to find and fix.
        </p>
      </div>

      <div class="popup-divider"></div>

      <label class="popup-toggle" for="debug-toggle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 2h8" />
          <path d="M9 6V4h6v2" />
          <rect x="7" y="6" width="10" height="14" rx="5" />
          <path d="M3 11h4M17 11h4M3 16h4M17 16h4" />
        </svg>
        <span class="popup-toggle-label">Debug mode</span>
        <span class="toggle-switch">
          <input type="checkbox" id="debug-toggle" />
          <span class="toggle-track"></span>
        </span>
      </label>

      <p id="debug-hint" class="popup-hint">
        Turn on to see ORE's progress on each page and send a detailed log with issue reports.
      </p>

      <label class="popup-toggle popup-toggle--sub" for="log-copy-toggle" id="log-copy-row" hidden>
        <span class="popup-toggle-label">Offer "Copy log" after each pass</span>
        <span class="toggle-switch">
          <input type="checkbox" id="log-copy-toggle" />
          <span class="toggle-track"></span>
        </span>
      </label>

      <div class="popup-divider"></div>

      <nav class="popup-footer" aria-label="More">
        <button id="page-tour-btn" class="popup-link" type="button">Page tour</button>
        <span class="popup-footer-sep" aria-hidden="true"></span>
        <button id="tour-btn" class="popup-link" type="button">How it works</button>
        <span class="popup-footer-sep" aria-hidden="true"></span>
        <button id="options-btn" class="popup-link" type="button">Settings</button>
      </nav>
    </div>

    <div id="popup-status" class="popup-status" hidden></div>

    <script src="popup.js"></script>
  </body>
</html>
